<style>
/* Layout: one calm column. A five-question interview, then a ranked plan list with a two-plan side-by-side on top. */

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e191b; --surface:#16262a; --ink:#e7f0ef; --muted:#9fb3b5; --line:#2c4144;
  --accent:#62c6c3; --accent-ink:#05282a; --soft:#1c3539; --star:#e4b24e;
  --good:#74d29c; --warn:#e6b062; --bad:#f29187; --warn-bg:#33290f; --bad-bg:#3a1c19; --good-bg:#16321f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e191b; --surface:#16262a; --ink:#e7f0ef; --muted:#9fb3b5; --line:#2c4144;
  --accent:#62c6c3; --accent-ink:#05282a; --soft:#1c3539; --star:#e4b24e;
  --good:#74d29c; --warn:#e6b062; --bad:#f29187; --warn-bg:#33290f; --bad-bg:#3a1c19; --good-bg:#16321f; color-scheme:dark }
*{box-sizing:border-box}

.wrap{max-width:1040px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

details{font-size:.92rem} details p{margin-top:8px;max-width:75ch}

.sb .tw{overflow-x:auto}

@media print{
  @page{size:letter;margin:11mm 13mm}

  :root{padding:0!important}

  .wrap{max-width:none;padding:0;gap:0}

<div class="wrap">
  <header class="top">
    <h1>California Part D Compare <span class="muted" style="font-weight:500">· {{YEAR}} plans</span></h1>
    <p class="notice">Independent estimates from CMS public data. Not Medicare.gov, and not an enrollment site.</p>
  </header>
  <ol class="steps" id="steps"></ol>
  <main id="view"></main>
</div>

<script>const D=/*DATA*/null;</script>
<script>
const CAP=D.meta.cap, STEPS=['Location','Coverage','Cost help','Prescriptions','Pharmacy','Results'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=(n,d)=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:d??(n%1?2:0),maximumFractionDigits:d??2});
const drugIdx=new Map(D.drugs.map((d,i)=>[d[0],i]));
const nets=D.nets.map(n=>n.map(b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0))));
const bit=(a,i)=>(a[i>>3]>>(i&7))&1;
function drugLabel(d){const m=d[1].match(/^(.*) \[(.+)\]$/);return m?`${m[2]} (${m[1]})`:d[1].charAt(0).toUpperCase()+d[1].slice(1)}

const EX=D.meta.example;
let S={step:0,zip:EX.zip,county:EX.county,type:'pdp',help:'none',rx:EX.rx.map(r=>({...r})),ph:EX.ph,example:true,snp:false,sort:'total',fill:'r30',cmp:[]};
try{const s=JSON.parse(localStorage.getItem('pdc')||'null');if(s&&s.v===D.meta.v)S=Object.assign(S,s.s)}catch(e){}
function save(){try{localStorage.setItem('pdc',JSON.stringify({v:D.meta.v,s:S}))}catch(e){}}
const LIS=D.meta.lis, PROG=['medicaid','ssi','msp','lis'];
const lisDefault=h=>({medicaid:'low',ssi:'low'}[h]||'std');
function lisLevel(){return PROG.includes(S.help)?(S.lvl||lisDefault(S.help)):null}
const lisCap=(lv,d)=>lv==='zero'?0:LIS[lv][d[4]?0:1];

/* ---------- cost engine ---------- */
function phStatus(plan,ph){ if(ph==null)return 'none'; const n=nets[plan.net]; return bit(n[1],ph)?'pref':bit(n[0],ph)?'std':'out'; }
function share(plan,tier,st){ const cs=plan.cost[tier]; if(!cs)return null; const p=st==='pref'&&cs[0]!==0; return {type:p?cs[0]:cs[2],amt:p?cs[1]:cs[3],ded:!!cs[4]&&plan.ded>0,pref:p}; }
/* 90-day cost sharing for a tier: retail at the chosen pharmacy, or the plan's mail-order pharmacy. null = not offered. */
/* Quantity limits: the plan's limit as written, and the same limit as a 30-day amount to compare with what was entered. */
const qNum=n=>String(Math.round(n*100)/100);
const qlText=x=>x.ql?'Quantity limit '+qNum(x.ql[0])+' per '+x.ql[1]+' days':'Quantity limit';
const qlPer30=x=>x.ql[0]*30/x.ql[1];
const flagTexts=x=>[qlText(x),'Prior authorization','Step therapy'].filter((_,b)=>x.flags>>b&1);
function share90(plan,tier,st,mode){ const c=plan.c90&&plan.c90[tier]; if(!c)return null;
  const k=mode==='m90'?(c[4]!==0?4:c[6]!==0?6:-1):((st==='pref'&&c[0]!==0)?0:c[2]!==0?2:-1);
  return k<0?null:{type:c[k],amt:c[k+1],ded:!!c[8]&&plan.ded>0,pref:k===0||k===4,mail:mode==='m90',days:90}; }
const perFill=sh=>sh.days===90?' per 3-month fill'+(sh.mail?' by mail':''):'';
function shareText(sh){ return (sh.type===1?usd(sh.amt)+' copay':Math.round(sh.amt*1000)/10+'% of the drug price')+perFill(sh); }
const FILL={r30:'One-month fills at your pharmacy',r90:'Three-month fills at your pharmacy',m90:'Three-month fills by mail order'};
/* mode: r30 = a 30-day fill every month at the chosen pharmacy; r90 = 90-day fills there; m90 = 90-day fills by mail.
   A drug the plan does not offer that way stays on monthly fills at the chosen pharmacy. */
function estimate(plan,rx,ph,mode='r30'){
  const st=phStatus(plan,ph), form=D.forms[plan.f], lv=lisLevel();
  let dedLeft=plan.ded, oop=0; const months=Array(12).fill(0);
  const per=rx.map(r=>{const d=D.drugs[r.i],raw=form[d[0]],code=Array.isArray(raw)?raw[0]:raw,ql=Array.isArray(raw)?[raw[1],raw[2]]:null,tier=code==null?null:code>>3;
    let use='r30',sh=null;
    if(tier!=null){ if(mode==='m90'||(mode==='r90'&&st!=='out')){sh=share90(plan,tier,st,mode);if(sh)use=mode} if(!sh)sh=share(plan,tier,st); }
    const k=use==='r30'?1:3;
    return{d,q:r.q,k,use,oon:use!=='m90'&&st==='out',full:d[2]!=null?d[2]*r.q*k:null,tier,ql,over:!!ql&&r.q>ql[0]*30/ql[1]+1e-6,flags:code==null?0:code&7,total:0,unk:false,first:null,sh}});
  for(let m=0;m<12;m++) for(const x of per){
    if(x.k===3&&m%3)continue;
    let pay=0; const full=x.full, sh=x.sh;
    if(x.oon||x.tier==null){ if(full==null)x.unk=true; else pay=full; }
    else{
      if(!sh){x.unk=true}
      else if(oop>=CAP){pay=0}
      else if(x.d[3]){ const capI=35*x.k; let v=sh.type===1?sh.amt:(full!=null?sh.amt*full:capI);
        const ia=x.k===3?(plan.ins90&&plan.ins90[x.tier]):(plan.ins&&plan.ins[x.tier]);
        if(ia){const o=sh.mail?2:0,a=sh.pref&&ia[o]!=null?ia[o]:ia[o+1]; if(a!=null)v=Math.min(v,a)}
        pay=Math.min(v,capI,full??Infinity); }
      else{ let rem=full;
        if(sh.ded&&dedLeft>0){ if(full==null)x.unk=true; else{const k=Math.min(full,dedLeft);pay+=k;dedLeft-=k;rem=full-k} }
        if(full==null){ if(sh.type===1)pay+=sh.amt; else x.unk=true }
        else if(rem>0) pay+=sh.type===1?Math.min(sh.amt,rem):sh.amt*rem;
      }
      /* Extra Help: one copay per fill whatever the days' supply (CMS Part D manual, chapter 13, section 60.4.2) */
      if(sh){const capped=oop>=CAP;pay=Math.min(pay,Math.max(0,CAP-oop));oop+=pay;
        if(lv){const c=lisCap(lv,x.d);pay=(x.unk&&!capped)?c:Math.min(pay,c);x.unk=false}}
    }
    if(m===0)x.first=pay; x.total+=pay; months[m]+=pay;
  }
  const drug=months.reduce((a,b)=>a+b,0);
  const premMo=lv&&plan.premLis!=null?plan.premLis:plan.prem;
  return {plan,st,per,months,drug,lv,premMo,mode,overQL:per.filter(x=>x.over).length,pa:per.filter(x=>x.tier!=null&&x.flags&2).length,n90:per.filter(x=>x.k===3).length,prem:premMo*12,total:drug+premMo*12,unk:per.some(x=>x.unk),covered:per.filter(x=>x.tier!=null).length,capMonth:oop>=CAP};
}
/* All three ways to fill for one plan, and the one the results use. */
function estimateAll(plan){
  const alt={r30:estimate(plan,S.rx,S.ph,'r30'),r90:estimate(plan,S.rx,S.ph,'r90'),m90:estimate(plan,S.rx,S.ph,'m90')};
  const best=['r90','m90'].reduce((b,k)=>alt[k].n90&&alt[k].total<=alt[b].total-5?k:b,'r30'); /* a switch has to save at least $5 a year to count */
  const want=S.fill||'r30', pick=want==='best'?best:(alt[want].n90||want==='r30'?want:'r30');
  const e=alt[pick]; e.alt=alt; e.pick=pick; e.best=best; return e;
}
function waysRows(e,fmt){ return ['r30','r90','m90'].map(k=>{const a=e.alt[k],d=e.alt.r30.total-a.total;
  const note=k==='r30'?'':!a.n90?'not offered for your drugs':Math.abs(d)<5?'about the same':d>0?'saves '+usd(d,0):'costs '+usd(-d,0)+' more';
  return fmt(FILL[k],k!=='r30'&&!a.n90?'':usd(a.total,0),note,k===e.pick)}); }
const mediCal=()=>S.help==='medicaid'||S.help==='ssi'; /* SSI recipients in California get Medi-Cal automatically */
const dualWho=()=>S.help==='ssi'?'Medi-Cal or SSI':'Medi-Cal';
function snpShown(p){return p.snp===2&&mediCal()?S.dsnp!==false:!!S.snp}
function plansFor(){
  const codes=D.counties[S.county]||[];
  return D.plans.filter(p=>{
    if(p.type==='PDP'){ if(S.type==='ma')return false } else { if(S.type==='pdp')return false; if(!p.cty.some(c=>codes.includes(c)))return false }
    if(p.snp&&!snpShown(p))return false; return true; });
}

/* ---------- rendering ---------- */
function stars(p){ if(p.star==null)return `<span class="small muted">${esc(p.starNote||'No rating')}</span>`;
  return `<span title="${p.star} out of 5 stars"><span class="stars" aria-hidden="true">★★★★★<i style="width:${p.star*20}%">★★★★★</i></span> <span class="small num">${p.star} of 5</span></span>`; }
const stChip={pref:['good','Preferred pharmacy'],std:['plain','In network (standard cost)'],out:['bad','Not in network'],none:['plain','No pharmacy chosen']};
function go(n){if(n!==4)phPlan=null;S.step=n;save();render();window.scrollTo(0,0)}
function nav(back,nextLabel,ok=true){return `<div class="row end"><button class="btn ghost" id="back" ${back?'':'hidden'}>Back</button><button class="btn" id="next" ${ok?'':'disabled'}>${nextLabel||'Continue'}</button></div>`}
function bindNav(){const b=$('#back'),n=$('#next');if(b)b.onclick=()=>go(S.step-1);if(n)n.onclick=()=>go(S.step+1)}
function exBanner(){return S.example?`<div class="banner ex">These answers are an <b>example</b> so you can see how the tool works. <button class="btn link" id="clear">Clear and start with my own answers</button></div>`:''}
function resetAll(){CLIENT={name:'',email:''};mailNote='';S=Object.assign(S,{step:0,zip:'',county:null,type:'pdp',help:'none',lvl:null,dsnp:null,rx:[],ph:null,example:false,snp:false,sort:'total',fill:'r30',cmp:[]});save();render();window.scrollTo(0,0);const z=$('#zip');if(z)z.focus()}
function bindEx(){const c=$('#clear');if(c)c.onclick=resetAll}
const newBtn=()=>`<span class="newc"><button class="btn" data-new>Start a new client</button></span>`;
function bindNew(){document.querySelectorAll('.newc').forEach(w=>{const ask=()=>{w.innerHTML=`<span class="small"><b>Clear every answer and start again?</b></span> <button class="btn" data-yes>Yes, clear</button> <button class="btn ghost" data-no>Cancel</button>`;
    w.querySelector('[data-yes]').onclick=resetAll;w.querySelector('[data-no]').onclick=()=>{w.innerHTML=newBtn().replace(/^<span class="newc">|<\/span>$/g,'');w.querySelector('[data-new]').onclick=ask;w.querySelector('[data-new]').focus()};w.querySelector('[data-no]').focus()};
  w.querySelector('[data-new]').onclick=ask})}
function touched(){S.example=false}

function render(){
  $('#steps').innerHTML=STEPS.map((s,i)=>`<li class="${i<S.step?'done':i===S.step?'cur':''}"><button data-s="${i}" ${i===S.step?'aria-current="step"':''}>${i+1}. ${s}</button></li>`).join('');
  $('#steps').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=+b.dataset.s;if(n<=S.step||ready(n))go(n)});
  [vLoc,vType,vHelp,vRx,vPh,vRes][S.step]();

function ready(n){return (n<1||!!S.county)&&(n<5||S.rx.length>0)}

  <div class="row"><input class="zip num" id="zip" type="text" inputmode="numeric" maxlength="5" autocomplete="postal-code" aria-label="ZIP code" value="${esc(S.zip||'')}"><span id="zipmsg" class="muted"></span></div>
  <div id="cty"></div>${nav(false,'Continue',!!S.county)}</section>`;
  const upd=()=>{const z=$('#zip').value.trim();S.zip=z;const c=D.zips[z]||[];
    if(z.length===5&&!c.length){S.county=null;$('#zipmsg').textContent='This ZIP code is not in the California data.'}
    else $('#zipmsg').textContent=c.length===1?c[0]+' County':'';

    $('#cty').innerHTML=c.length>1?`<p><b>This ZIP code crosses county lines. Which county do you live in?</b></p><div class="opts">${c.map(n=>`<label class="opt"><input type="radio" name="cty" value="${esc(n)}" ${n===S.county?'checked':''}><span><b>${esc(n)} County</b></span></label>`).join('')}</div>`:'';
    $('#cty').querySelectorAll('input').forEach(i=>i.onchange=()=>{S.county=i.value;save()});

function radios(name,opts,cur){return `<div class="opts">${opts.map(o=>`<label class="opt"><input type="radio" name="${name}" value="${o[0]}" ${o[0]===cur?'checked':''}><span><b>${o[1]}</b><span class="muted small">${o[2]||''}</span></span></label>`).join('')}</div>`}

/* Drug search. The drug list writes microgram strengths as fractions of a milligram (50 mcg is "0.05 MG"),
   so each name also carries its mcg equivalents, and numbers in a search must match a whole number in the name. */
const MCG=[], HAY=D.drugs.map((d,i)=>{const n=d[1].toLowerCase(),m=[];
  n.replace(/(\d*\.\d+) mg/g,(_,v)=>{if(+v<1){const x=String(+(+v*1000).toFixed(3));if(!m.includes(x))m.push(x)}return ''});
  const show=m.filter(x=>+x<500); MCG[i]=show.length?show:null; return n+m.map(x=>' '+x+' mcg').join('')});
const mcgNote=d=>{const m=MCG[drugIdx.get(d[0])];return m?' · '+m.join(', ')+' mcg':''};
function drugTokens(q){return q.toLowerCase().replace(/[µμ]g|\bug\b|micrograms?/g,'mcg').replace(/milligrams?/g,'mg').replace(/,/g,' ')
  .replace(/(\d)\s*(mcg|mg|ml|units?|unt)\b/g,'$1 $2').replace(/\bunits?\b/g,'unt').split(/\s+/).filter(Boolean)}
function tokenTest(w){ if(!/^\d*\.?\d+$/.test(w))return n=>n.includes(w);
  const r=new RegExp('(?<![\\d.])'+(w[0]==='.'?'0':'')+w.replace('.','\\.')+'(?!\\d|\\.\\d)'); return n=>r.test(n)}
function rxList(){return S.rx.length?`<ul class="rx">${S.rx.map((r,k)=>`<li><span class="nm">${esc(drugLabel(D.drugs[r.i]))}<span class="small muted" style="font-weight:400">${mcgNote(D.drugs[r.i])}</span></span><label class="small">Quantity per 30 days <input type="number" min="1" max="999" step="1" data-k="${k}" id="q${D.drugs[r.i][0]}" value="${r.q}"></label><button class="btn link" data-rm="${k}">Remove</button></li>`).join('')}</ul>`:'<p class="muted">No prescriptions added yet.</p>'}
function vRx(){
  $('#view').innerHTML=`<section class="card"><h2>Which prescriptions do you take?</h2><p class="q-help">Type a drug name and strength, such as “atorvastatin 20”, “Eliquis 5” or “levothyroxine 50 mcg”, then pick the match. Enter how many tablets or capsules you fill every 30 days. For liquids, injection pens, creams and inhalers, enter the amount in millilitres or grams.</p>
  <div class="search"><input type="text" id="dq" placeholder="Search drugs" aria-label="Search drugs" autocomplete="off"><ul class="hits" id="dh" hidden></ul></div>
  <div id="rxl">${rxList()}</div>${nav(true,'Continue',S.rx.length>0)}</section>`;
  const bindList=()=>{ $('#rxl').innerHTML=rxList(); $('#next').disabled=!S.rx.length;
    $('#rxl').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.rx.splice(+b.dataset.rm,1);touched();save();bindList()});
    $('#rxl').querySelectorAll('input').forEach(i=>i.onchange=()=>{S.rx[+i.dataset.k].q=Math.max(1,Math.min(999,+i.value||30));touched();save()}); };
  $('#dq').oninput=e=>{const t=drugTokens(e.target.value),h=$('#dh');
    if(!t.join('').length||t.join('').length<2){h.hidden=true;return}
    const tests=t.map(tokenTest);let out=[];for(let i=0;i<HAY.length;i++){const n=HAY[i];if(tests.every(f=>f(n)))out.push(i)}
    const rank=i=>{const l=drugLabel(D.drugs[i]).toLowerCase();return (l.startsWith(t[0])?0:1000)+l.length};out=out.sort((x,y)=>rank(x)-rank(y)).slice(0,40);
    h.hidden=false;h.innerHTML=out.length?out.map(i=>`<li><button data-i="${i}">${esc(drugLabel(D.drugs[i]))}<span class="small muted">${mcgNote(D.drugs[i])}</span></button></li>`).join(''):'<li><button disabled>No match on any California plan’s drug list</button></li>';
    h.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!S.rx.some(r=>r.i===i))S.rx.push({i,q:30});touched();save();$('#dq').value='';h.hidden=true;bindList()}) };
  bindList(); bindNav();
}
/* Straight-line miles between the centres of two ZIP codes. */
function miles(a,b){const p=D.zll[a],q=D.zll[b];if(!p||!q)return null;const r=Math.PI/180,x=Math.sin((q[0]-p[0])*r/2)**2+Math.cos(p[0]*r)*Math.cos(q[0]*r)*Math.sin((q[1]-p[1])*r/2)**2;return 7917.6*Math.asin(Math.sqrt(x))}
const milesText=m=>m==null?'':m<0.5?' · in your ZIP code':' · about '+(m<10?Math.round(m*2)/2:Math.round(m))+' mi';
function phLabel(i){const p=D.pharm[i];return `<b>${esc(p[0])}</b><br><span class="small muted">${esc(p[1])}, ${esc(p[2])} ${esc(p[3])}</span>`}
let phPlan=null; /* when set, the pharmacy step lists only this plan's in-network pharmacies */
const isKaiser=p=>/kaiser/i.test(p.org+' '+p.name);
function oonNote(e,short){ if(e.st!=='out')return '';
  return isKaiser(e.plan)?(short?'Kaiser plans mainly use Kaiser’s own pharmacies, and the one you chose is not in this plan’s network. Full price assumed.':'Kaiser Permanente plans fill prescriptions mainly at Kaiser’s own pharmacies, and the pharmacy you chose is not in this plan’s network. This estimate assumes you pay full price for every fill, which is why it is so high.')
    :(short?'The pharmacy you chose is not in this plan’s network. Full price assumed.':'The pharmacy you chose is not in this plan’s network, so this estimate assumes you pay full price for every fill.') }
const oonLink=e=>e.st==='out'?` <button class="btn link" data-phplan="${esc(e.plan.id)}">See ${isKaiser(e.plan)?'Kaiser pharmacies':'this plan’s pharmacies'} near you</button>`:'';
function vPh(){
  const only=phPlan&&D.plans.find(x=>x.id===phPlan), inNet=only?nets[only.net][0]:null;
  $('#view').innerHTML=`<section class="card"><h2>Where do you fill your prescriptions?</h2><p class="q-help">Plans charge less at their preferred pharmacies and may not cover a pharmacy outside their network. Search by pharmacy name, city or ZIP code. The nearest pharmacies are listed first.</p>
  <div class="search"><input type="text" id="pq" placeholder="Search pharmacies" aria-label="Search pharmacies" autocomplete="off" value="${S.ph==null&&!only?esc(S.zip||''):''}">
  ${only?`<p class="banner ex" id="onlynote">Showing only pharmacies in the network of <b>${esc(only.name)}</b>, nearest first. <button class="btn link" id="allph">Show all pharmacies</button></p>`:''}
  <ul class="hits" id="phh"></ul></div>
  <div id="cur"></div>${nav(true,'See plans')}</section>`;
  const cur=()=>{$('#cur').innerHTML=S.ph!=null?`<p class="small muted">Your pharmacy</p><p>${phLabel(S.ph)} &nbsp;<button class="btn link" id="phx">Remove</button></p>`:'<p class="muted">No pharmacy chosen. Estimates will use each plan’s standard in-network cost.</p>';
    const x=$('#phx');if(x)x.onclick=()=>{S.ph=null;touched();save();cur();find()}};
  const find=()=>{const typed=$('#pq').value.trim(),raw=typed||(inNet?'':(S.zip||'')),t=raw.toLowerCase().split(/\s+/).filter(Boolean),h=$('#phh');let out=[];
    for(let i=0;i<D.pharm.length;i++){if(inNet&&!bit(inNet,i))continue;const p=D.pharm[i],n=(p[0]+' '+p[2]+' '+p[3]).toLowerCase();if(t.every(w=>n.includes(w)))out.push(i)}
    const dist=new Map(out.map(i=>[i,miles(S.zip,D.pharm[i][3])]));
    out=out.sort((a,b)=>(dist.get(a)??1e9)-(dist.get(b)??1e9)||a-b).slice(0,40);
    h.innerHTML=out.length?out.map(i=>`<li><button data-i="${i}" class="${i===S.ph?'sel':''}">${phLabel(i)}<span class="small muted">${milesText(dist.get(i))}</span></button></li>`).join(''):'<li><button disabled>No pharmacy found</button></li>';
    h.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.ph=+b.dataset.i;touched();save();cur();find()})};
  $('#pq').oninput=find; cur(); find(); bindNav();
  const ap=$('#allph'); if(ap)ap.onclick=()=>{phPlan=null;vPh()};
}

  return `<div><div><h3>${esc(p.name)}</h3><p class="small muted">${esc(p.org)} · ${p.type==='PDP'?'Part D drug plan':'Medicare Advantage'} · ${esc(p.id)}</p></div>

  <div><p class="small muted">Estimated total for {{YEAR}}</p><p class="big num">${usd(e.total,0)}${e.unk?'<span style="font-size:1rem"> + unpriced drugs</span>':''}</p></div>
  <dl class="kv"><dt>Premiums (${usd(e.premMo,2)} × 12)</dt><dd>${usd(e.prem,2)}</dd><dt>Your share of drug costs</dt><dd>${usd(e.drug,2)}</dd><dt>Drug deductible</dt><dd>${e.lv?'$0 with Extra Help':usd(p.ded,0)}</dd><dt>Drugs on the plan’s list</dt><dd>${e.covered} of ${e.per.length}</dd><dt>Need the plan’s approval first (prior authorization)</dt><dd>${e.pa?e.pa+' of '+e.per.length:'None'}</dd></dl>
  <p><span class="chip ${ch[0]}">${ch[1]}</span></p>${e.st==='out'?`<p class="small">${oonNote(e)}${oonLink(e)}</p>`:''}
  <div class="ways"><p class="small muted">Ways to fill your prescriptions, estimated total for the year</p><dl class="kv">${waysRows(e,(l,v,n,on)=>`<dt${on?' class="on"':''}>${l}${on?' <span class="chip plain">shown here</span>':''}</dt><dd${on?' class="on"':''}>${v}${n?` <span class="small ${/^saves/.test(n)?'save':'muted'}">${n}</span>`:''}</dd>`).join('')}</dl></div>
  <div><p class="small muted">Your drug costs month by month</p><div class="bars" role="img" aria-label="Monthly drug costs, January to December: ${e.months.map(m=>usd(m,0)).join(', ')}">${e.months.map(m=>`<span style="height:${Math.round(m/mx*100)}%" title="${usd(m,2)}"></span>`).join('')}</div><div class="barlab">${'JFMAMJJASOND'.split('').map(c=>`<span>${c}</span>`).join('')}</div>
  <p class="small muted">January ${usd(e.months[0],2)} · December ${usd(e.months[11],2)}${e.capMonth?' · reaches the '+usd(CAP,0)+' yearly cap':''}${e.n90?' · three-month fills are paid in January, April, July and October':''}</p></div>
  <div class="drugs">${e.per.map(x=>{const fl=flagTexts(x);
    return `<div><div class="ln"><b>${esc(drugLabel(x.d))}<span class="small muted" style="font-weight:400">${mcgNote(x.d)}</span></b><b class="num">${x.unk?'n/a':usd(x.total,2)}</b></div>
    <div class="small muted">${x.tier==null?'<span class="chip bad">Not on the plan’s drug list</span> You pay full price.':`Tier ${x.tier}${x.sh&&!x.oon?' · '+(e.lv?'Extra Help copay, '+(e.lv==='zero'?'$0':'up to '+usd(lisCap(e.lv,x.d),2)+(x.d[4]?' (generic)':' (brand)'))+perFill(x.sh):shareText(x.sh)+(x.sh.ded?' after the deductible':'')):''}${x.d[3]?' · insulin, capped at $35 a month':''}${e.mode!=='r30'&&x.k===1&&x.tier!=null?' · monthly fills only':''}`}${x.full==null?' · no price on file':''}</div>
    ${fl.length?`<div class="small">${fl.map((f,i)=>`<span class="chip ${x.over&&i===0&&x.flags&1?'bad':'warn'}">${f}</span>`).join(' ')}</div>`:''}
    ${x.over?`<div class="small"><b>Over this plan’s quantity limit.</b> You entered ${qNum(x.q)} per 30 days and the plan covers up to ${qNum(x.ql[0])} per ${x.ql[1]} days${x.ql[1]!==30?' (about '+qNum(qlPer30(x))+' per 30 days)':''}. Getting more needs an exception from the plan. This estimate assumes the full quantity is covered.</div>`:''}</div>`}).join('')}</div></div>`; }
/* ---------- why two plans cost different amounts: premiums, and each drug's tier and price on each plan ---------- */
function tierPay(e,x){
  if(x.tier==null)return 'Not on the drug list. Full price.';
  if(x.oon)return 'Tier '+x.tier+' · pharmacy not in network, full price';
  if(!x.sh)return 'Tier '+x.tier;
  return 'Tier '+x.tier+' · '+(e.lv?'Extra Help copay, '+(e.lv==='zero'?'$0':'up to '+usd(lisCap(e.lv,x.d),2))+perFill(x.sh):shareText(x.sh)+(x.sh.ded?' after the deductible':''));
}
const moreOn=(d,a,b)=>Math.abs(d)<0.5?'Same':usd(Math.abs(d),0)+' more on '+esc((d>0?b:a).plan.name);
const tierDiffers=(x,y)=>x.tier!==y.tier;
function tierSpread(list,j){ const c={}; for(const e of list){const t=e.per[j].tier; c[t==null?'x':t]=(c[t==null?'x':t]||0)+1}
  const parts=Object.keys(c).filter(k=>k!=='x').sort((a,b)=>a-b).map(k=>'Tier '+k+' on '+c[k]); if(c.x)parts.push('not covered on '+c.x);
  return {text:parts.join(', '),varies:Object.keys(c).length>1}; }
/* ---------- star rating breakdown: the CMS summary, domain and measure ratings behind each plan's stars ---------- */
const STAR=D.stars, starOf=p=>STAR.c[p.id.split('-')[0]];
function starCell(v,res){
  if(typeof v==='number')return `<span title="${v} out of 5 stars"><span class="stars" aria-hidden="true">★★★★★<i style="width:${v*20}%">★★★★★</i></span> <span class="small num">${v} of 5</span></span>${res!=null&&typeof res!=='undefined'&&!/Medicare shows only/.test(String(res))&&res!==''?`<br><span class="small muted">Result: ${esc(res)}</span>`:''}`;
  return `<span class="small muted">${esc(v==null||v===''?'Not available':v)}</span>`;
}
function perfChip(p){const r=starOf(p); if(!r)return '';
  return r.lp?'<span class="chip bad">CMS low-performing plan</span>':r.hp?'<span class="chip good">CMS high-performing plan</span>':''}
function starCard(es){
  es=es.filter(Boolean); if(!es.length)return '';
  const rs=es.map(e=>starOf(e.plan)), col=f=>rs.map(r=>`<td>${r?f(r):'<span class="small muted">No rating data</span>'}</td>`).join('');

  const row=(label,f,cls)=>`<tr${cls?` class="${cls}"`:''}><th scope="row">${label}</th>${col(f)}</tr>`;
  const dom=(kind)=>STAR.domains.map((d,i)=>[d,i]).filter(([d])=>d[0].startsWith(kind));
  const measRows=kind=>dom(kind).map(([d,i])=>`<tr class="grp"><th scope="row" colspan="${es.length+1}">${esc(d[1])}</th></tr>`+
    STAR.measures.map((m,j)=>[m,j]).filter(([m])=>m[2]===i).map(([m,j])=>row(`${esc(m[1])}<br><span class="small muted">${esc(m[0])}${m[3]&&m[3]!=='Not Applicable'?' · measured '+esc(m[3]):''}</span>`,r=>starCell(r.m?r.m[j]:null,r.v?r.v[j]:null),'sub')).join('')).join('');
  const hasHealth=rs.some(r=>r&&r.d&&r.d.slice(0,5).some(v=>typeof v==='number'));
  const flags=es.map((e,k)=>{const r=rs[k]; return r&&r.lp?`<p class="banner warn"><b>${esc(e.plan.name)}:</b> CMS marks this insurer’s contract as low performing because it has been rated under 3 stars for three years in a row (${esc(r.lp)}).</p>`:r&&r.hp?`<p class="banner ex"><b>${esc(e.plan.name)}:</b> CMS marks this insurer’s contract as high performing, with 5 stars (${esc(r.hp)}).</p>`:''}).join('');
  return `<section class="card sb"><div><h2>Star rating breakdown</h2>
  <p class="q-help" style="margin-top:8px">Medicare rates plans from 1 to 5 stars each year. These are the CMS {{YEAR}} ratings behind the stars shown above: the summary ratings, the areas they are built from, and every individual measure with the plan’s result.</p></div>
  ${flags}
  <div class="tw"><table>${head}<tbody>
  ${row('Overall rating',r=>starCell(r.s[2]))}
  ${row('Drug plan rating (Part D)',r=>starCell(r.s[1]))}
  ${row('Health plan rating (Part C)',r=>starCell(r.s[0]))}
  <tr class="grp"><th scope="row" colspan="${es.length+1}">Drug plan areas</th></tr>
  ${dom('DD').map(([d,i])=>row(esc(d[1]),r=>starCell(r.d?r.d[i]:null),'sub')).join('')}
  ${hasHealth?`<tr class="grp"><th scope="row" colspan="${es.length+1}">Health plan areas</th></tr>${dom('HD').map(([d,i])=>row(esc(d[1]),r=>starCell(r.d?r.d[i]:null),'sub')).join('')}`:''}

  ${S.rx.map((r,j)=>`<tr><th scope="row">${esc(drugLabel(D.drugs[r.i]))}${mcgNote(D.drugs[r.i])}<br><small>${r.q} per 30 days</small></th>${es.map(e=>`<td>${drugCell(e,j)}</td>`).join('')}${es.length===2?`<td>${es[0].per[j].unk||es[1].per[j].unk?'':moreOn(es[1].per[j].total-es[0].per[j].total,es[0],es[1])}${tierDiffers(es[0].per[j],es[1].per[j])?'<br><small>Different tier</small>':''}</td>`:''}</tr>`).join('')}
  </tbody></table>
  <h2>Your drug costs month by month</h2>
  <table class="mo"><thead><tr><th></th>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map(m=>`<th scope="col">${m}</th>`).join('')}</tr></thead><tbody>
  ${es.map(e=>`<tr><td>${esc(e.plan.name)}</td>${e.months.map(m=>`<td>${usd(m,0)}</td>`).join('')}</tr>`).join('')}
  </tbody></table>`;
  return `<section id="printdoc" class="printonly"><h1>Part D plan comparison · ${yr}</h1>
  <p class="meta"><span>Prepared for: ______________________________</span><span>${when}</span></p>
  <h2>Your answers</h2>
  <dl class="ans"><dt>Location</dt><dd>${esc(S.zip)} · ${esc(S.county)} County, California</dd>
  <dt>Coverage</dt><dd>${{pdp:'Part D drug plans',ma:'Medicare Advantage plans with drug coverage',both:'Part D drug plans and Medicare Advantage plans'}[S.type]}</dd>
  <dt>Help with costs</dt><dd>${help}</dd>
  <dt>Pharmacy</dt><dd>${ph?esc(ph[0])+', '+esc(ph[1])+', '+esc(ph[2])+' '+esc(ph[3]):'None chosen. Standard in-network costs used.'}</dd></dl>
  ${body}
  <div class="fine"><p><b>These are estimates, not quotes.</b> ${esc(D.meta.priceNote)} Real prices differ by plan and pharmacy.</p>
  <p>Each estimate assumes every drug is filled all year by the method shown, the ${usd(CAP,0)} yearly cap on covered drug costs and the $35 monthly insulin cap. It leaves out the Part B premium, late-enrollment penalties and medical costs. Plan data: CMS ${yr} public files. Not affiliated with Medicare.gov. Confirm costs with the plan or at Medicare.gov before enrolling.</p></div></section>`;
}
const PAGE_W=8.5*96-2*13*96/25.4, PAGE_H=11*96-2*11*96/25.4;
function fitPrint(){
  const d=$('#printdoc'); if(!d)return 1;
  let k=1; const keep=d.getAttribute('style')||'';
  for(let i=0;i<14;i++){
    d.style.cssText='display:block;position:absolute;left:-99999px;top:0;visibility:hidden;width:'+(PAGE_W/k)+'px';
    const h=d.offsetHeight*k, room=PAGE_H*0.975;
    if(h<=room)break;
    k=Math.max(0.45,k*Math.min(0.98,Math.sqrt(room/h)));
  }
  d.style.cssText=keep; d.style.zoom=k; d.dataset.scale=k.toFixed(2);
  return k;
}
window.addEventListener('beforeprint',fitPrint);
function vRes(){
  const list=plansFor().map(estimateAll);
  const sorts={total:(a,b)=>a.total-b.total,prem:(a,b)=>a.premMo-b.premMo||a.total-b.total,star:(a,b)=>(b.plan.star??0)-(a.plan.star??0)||a.total-b.total,pa:(a,b)=>a.pa-b.pa||a.total-b.total};
  list.sort(sorts[S.sort]);
  const ids=new Set(list.map(e=>e.plan.id)); S.cmp=S.cmp.filter(i=>ids.has(i));
  if(!S.cmp.length){S.cmp=[...list].sort(sorts.total).slice(0,2).map(e=>e.plan.id)}
  const by=Object.fromEntries(list.map(e=>[e.plan.id,e]));
  const here=p=>p.type==='PDP'||p.cty.some(c=>(D.counties[S.county]||[]).includes(c));
  const snps=D.plans.filter(p=>p.snp&&here(p)&&(p.type==='PDP'?S.type!=='ma':S.type!=='pdp'));
  const nD=mediCal()?snps.filter(p=>p.snp===2).length:0, nSnp=snps.length-nD;
  const nDhidden=mediCal()&&S.type==='pdp'?D.plans.filter(p=>p.snp===2&&p.type!=='PDP'&&here(p)).length:0;
  const canPrint=(()=>{try{return window.self===window.top}catch(e){return false}})();
  $('#view').innerHTML=`<div class="results" style="display:flex;flex-direction:column;gap:20px">
  ${S.example?`<div class="banner ex">Example results for a made-up person in ${esc(S.zip)}. <button class="btn link" id="clear">Clear and start with my own answers</button></div>`:''}
  <div class="summary">
    <button class="pill" data-go="0">${esc(S.zip)} · ${esc(S.county)} County</button>
    <button class="pill" data-go="1">${{pdp:'Part D drug plans',ma:'Medicare Advantage',both:'All plan types'}[S.type]}</button>
    <button class="pill" data-go="3">${S.rx.length} prescription${S.rx.length===1?'':'s'}</button>
    <button class="pill" data-go="4">${S.ph!=null?esc(D.pharm[S.ph][0]):'No pharmacy chosen'}</button>${newBtn()}</div>
  ${nDhidden?`<div class="banner ex"><b>${nDhidden} plan${nDhidden===1?'':'s'} in your county ${nDhidden===1?'is':'are'} built for people with Medicare and ${dualWho()}.</b> These dual-eligible plans (D-SNPs) are Medicare Advantage plans, so they are not in a list of Part D drug plans. <button class="btn link" id="showma">Show Medicare Advantage plans too</button></div>`:''}
  ${lisLevel()?`<div class="banner ex"><b>These estimates include Extra Help.</b> ${{zero:'$0 copays',low:'Copays of up to '+usd(LIS.low[0],2)+' for generics and '+usd(LIS.low[1],2)+' for brand-name drugs',std:'Copays of up to '+usd(LIS.std[0],2)+' for generics and '+usd(LIS.std[1],2)+' for brand-name drugs'}[lisLevel()]}, no drug deductible, and each plan’s reduced premium. <button class="btn link" data-go="2">Change</button></div>`:S.help==='unsure'?`<div class="banner warn"><b>These estimates do not include help with costs.</b> If you get Medi-Cal, SSI, a Medicare Savings Program or Extra Help, your premiums and drug costs will be lower than shown. <button class="btn link" data-go="2">Choose a program</button> to see estimates with that help.</div>`:''}
  <section style="display:flex;flex-direction:column;gap:12px"><div class="sidehead"><h2>Side by side</h2>${canPrint?'<button class="btn ghost" id="print">Print this comparison</button>':''}</div><p class="muted small">Starts with the two lowest-cost plans. Tick “Compare” on any two plans in the list to change it.</p>
    <div class="cmp">${cmpCol(by[S.cmp[0]])}${cmpCol(by[S.cmp[1]])}</div></section>
  ${mailCard(S.cmp.map(i=>by[i]),canPrint)}
  ${tierCard(by[S.cmp[0]],by[S.cmp[1]],list)}
  ${starCard(S.cmp.map(i=>by[i]))}
  <section style="display:flex;flex-direction:column;gap:12px"><h2>${list.length} plan${list.length===1?'':'s'} available</h2>
    <div class="tools"><label>Estimate with <select id="fill"><option value="r30">One-month fills at my pharmacy</option><option value="r90">Three-month fills at my pharmacy</option><option value="m90">Three-month fills by mail order</option><option value="best">Whichever is cheapest for each plan</option></select></label>
    <label>Sort by <select id="sort"><option value="total">Lowest estimated yearly cost</option><option value="prem">Lowest premium</option><option value="star">Highest star rating</option><option value="pa">Fewest prior authorizations</option></select></label>
    ${nD?`<label><input type="checkbox" id="dsnp" ${S.dsnp!==false?'checked':''}> Include ${nD} plan${nD===1?'':'s'} for people with Medicare and ${dualWho()} (D-SNP)</label>`:''}
    ${nSnp?`<label><input type="checkbox" id="snp" ${S.snp?'checked':''}> Include ${nSnp} ${nD?'other ':''}Special Needs Plan${nSnp===1?'':'s'}</label>`:''}</div>
    <ul class="plans">${list.map(e=>{const p=e.plan,ch=stChip[e.st],on=S.cmp.includes(p.id);
      return `<li class="${on?'on':''}"><div style="min-width:0;display:grid;gap:4px"><h3>${esc(p.name)}</h3>
      <div class="meta"><span>${esc(p.org)}</span>${stars(p)}<span class="chip ${ch[0]}">${ch[1]}</span>${e.covered<e.per.length?`<span class="chip bad">${e.per.length-e.covered} drug${e.per.length-e.covered===1?'':'s'} not covered</span>`:''}${e.pa?`<span class="chip warn">${e.pa} of ${e.per.length} drug${e.per.length===1?'':'s'} need${e.pa===1?'s':''} prior authorization</span>`:''}${e.overQL?`<span class="chip bad">${e.overQL} drug${e.overQL===1?'':'s'} over the quantity limit</span>`:''}${perfChip(p)}${p.snp?`<span class="chip warn">${['','Chronic condition SNP','Dual-eligible SNP','Institutional SNP'][p.snp]}</span>`:''}</div>
      <div class="meta num"><span>Premium ${usd(e.premMo,2)}/month</span><span>Deductible ${usd(e.lv?0:p.ded,0)}</span><span>Drug costs ${usd(e.drug,0)}/year</span></div>${e.st==='out'&&isKaiser(p)?`<div class="small">${oonNote(e,true)}${oonLink(e)}</div>`:''}${e.best!==e.pick&&e.total-e.alt[e.best].total>=10?`<div class="small save">${FILL[e.best]} would save about ${usd(e.total-e.alt[e.best].total,0)} a year on this plan.</div>`:e.pick!=='r30'?`<div class="small muted">${FILL[e.pick]}${e.n90<e.per.length?' ('+e.n90+' of '+e.per.length+' drugs)':''}</div>`:''}</div>
      <div class="tot"><b class="num">${usd(e.total,0)}${e.unk?'+':''}</b><span class="small muted">estimated for {{YEAR}}</span><label style="justify-content:flex-end;margin-top:6px"><input type="checkbox" data-c="${esc(p.id)}" ${on?'checked':''}> Compare</label></div></li>`}).join('')||'<li>No plans match. Try a different coverage type.</li>'}</ul></section>
  <details class="card"><summary><b>How these estimates are worked out, and what they leave out</b></summary>
    <p>Plans, deductibles, drug lists, tiers, copays and pharmacy networks come from the CMS {{YEAR}} Prescription Drug Plan Formulary and Pharmacy Network file (${esc(D.meta.planFile)}). Premiums come from the CMS {{YEAR}} landscape file (${esc(D.meta.landscapeFile)}). Star ratings are the CMS {{YEAR}} Star Ratings: the Part D rating for drug plans and the overall rating for Medicare Advantage plans.</p>
    <p><b>Drug prices are estimates.</b> ${esc(D.meta.priceNote)} Real prices differ by plan and pharmacy, which matters most for drugs with a percentage cost share and before the deductible is met.</p>
    <p><b>Ways to fill.</b> Each plan is estimated three ways: a 30-day fill every month at your pharmacy, a 90-day fill every three months at your pharmacy, and a 90-day fill every three months from the plan’s mail-order pharmacy (its preferred mail pharmacy where it has one). A drug the plan does not offer as a 90-day fill stays on monthly fills. A 90-day fill is priced at three times the 30-day price, the insulin cap is $35 for each month supplied, and with Extra Help a 90-day fill costs one copay. Your doctor has to write the prescription for 90 days.</p>
    <p><b>Emailing a comparison.</b> “PDF then Email” makes the PDF in your browser and opens a draft in your own email; this page sends nothing itself and does not store the client’s name or email address. The sender address is kept only in this browser.</p>
    <p><b>Star ratings.</b> The breakdown shows CMS’s {{YEAR}} Star Ratings data tables as published: summary ratings, the nine rated areas, and each measure’s stars and result with the period it was measured over. Ratings are given per contract, not per plan. Plans too new or too small to be measured show CMS’s own wording.</p>
    <p><b>Tiers.</b> The tier shown for each drug is the one in the plan’s CMS formulary file. The comparison of two plans lists each drug’s tier, what the plan charges for it and the yearly cost on each plan, and marks drugs that are on different tiers. CMS’s file gives tier numbers but not the plans’ names for them.</p>
    <p><b>Prior authorization.</b> Each plan shows how many of your drugs need the plan’s approval before it will cover them, as listed in the CMS formulary file. Your prescriber asks for the approval. The count does not change the cost estimate, and a plan can turn a request down.</p>
    <p><b>Quantity limits.</b> Where a plan limits how much of a drug it covers, the limit is shown as CMS publishes it, for example 30 per 30 days. The quantity you entered is compared with that limit at the same daily rate, and a drug is flagged when you entered more. The cost estimate still assumes the full quantity is covered, which would need an exception from the plan.</p>
    <p>Each estimate assumes every drug is filled all year by the method chosen, in {{YEAR}}, the plan deductible where it applies to the drug’s tier, the ${usd(CAP,0)} yearly cap on what you pay for covered drugs, and the $35 monthly cap on covered insulin. A pharmacy outside the plan’s network, or a drug not on the plan’s list, is charged at full price.</p>
    <p><b>Extra Help.</b> When you choose a program in step 3, each plan uses its premium for people with the full subsidy from the CMS landscape file, the drug deductible is removed, and each covered fill costs the lower of the plan’s price and the {{YEAR}} Extra Help copay for your level. The yearly cap is reached at the same point it would be without Extra Help, after which covered drugs cost $0. Generic and brand copays follow whether RxNorm lists the drug as generic or brand, which can differ from how a plan classifies it.</p>
    <p>Special Needs Plans are hidden unless you tick the box, except that plans for people with both Medicare and Medi-Cal (D-SNPs) are shown when you choose Medi-Cal or SSI in step 3. Left out: the Medicare Part B premium, 60-day fills, late-enrollment penalties, income-related premium surcharges, state help beyond Extra Help, and medical costs. For Medicare Advantage plans the premium is the plan’s combined medical and drug premium from the CMS landscape file. ZIP codes are matched to counties with the Census ZIP Code Tabulation Area table, which can differ from postal ZIP codes at the edges. Pharmacy names come from the CMS provider registry. Pharmacy distances are straight-line miles between the centre of your ZIP code and the centre of the pharmacy’s ZIP code, so they are approximate.</p>
    <p>Confirm costs with the plan or at Medicare.gov before enrolling.</p></details>
  <div class="row end"><button class="btn ghost" id="back">Back</button>${newBtn()}</div>
  ${printDoc(S.cmp.map(i=>by[i]).filter(Boolean))}</div>`;
  const pb=$('#print'); if(pb)pb.onclick=()=>{fitPrint();window.print()};
  bindMail(S.cmp.map(i=>by[i]));
  fitPrint(); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitPrint);
  $('#sort').value=S.sort; $('#sort').onchange=e=>{S.sort=e.target.value;save();vRes()};
  $('#fill').value=S.fill||'r30'; $('#fill').onchange=e=>{S.fill=e.target.value;S.cmp=[];save();vRes()};
  const sn=$('#snp'); if(sn)sn.onchange=()=>{S.snp=sn.checked;save();vRes()};
  document.querySelectorAll('[data-phplan]').forEach(x=>x.onclick=()=>{phPlan=x.dataset.phplan;S.step=4;save();render();window.scrollTo(0,0)});
  const dn=$('#dsnp'); if(dn)dn.onchange=()=>{S.dsnp=dn.checked;save();vRes()};
  const sm=$('#showma'); if(sm)sm.onclick=()=>{S.type='both';S.cmp=[];save();vRes()};
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  document.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{const id=c.dataset.c;if(c.checked){S.cmp.push(id);if(S.cmp.length>2)S.cmp.shift()}else S.cmp=S.cmp.filter(i=>i!==id);save();vRes()});
  bindNav(); bindEx(); bindNew();
}
if(S.step===5&&!ready(5))S.step=0;
render();
</script>
